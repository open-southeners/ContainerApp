name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "plans/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "plans/**"
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ""
    outputs:
      artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    name: Build
    runs-on: macos-26

    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # project.yml's MARKETING_VERSION is the single source of the app's version, so
      # every CI build reports it. A release tag must match it (ignoring any
      # prerelease suffix such as -beta.1).
      - name: Check app version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -nE 's/^ *MARKETING_VERSION: *"?([^"]+)"?$/\1/p' project.yml | head -1)"
          if [[ -z "${APP_VERSION}" ]]; then
            echo "::error::MARKETING_VERSION not found in project.yml"
            exit 1
          fi
          echo "App version: ${APP_VERSION}"
          if [[ -n "${VERSION}" && "${VERSION%%-*}" != "${APP_VERSION}" ]]; then
            echo "::error::Tag ${VERSION} does not match MARKETING_VERSION ${APP_VERSION} in project.yml. Bump project.yml before tagging."
            exit 1
          fi

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test
        run: |
          xcodebuild \
            -scheme ContainerApp \
            -destination 'platform=macOS,arch=arm64' \
            test

      # Packages are resolved fresh here, so check that the bundled licenses match what
      # was actually resolved. Fails release builds; only warns on branch/PR builds.
      - name: Check third-party notices
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/generate-third-party-notices.py
          if ! git diff --quiet -- ContainerApp/Resources/ThirdPartyNotices.txt; then
            git diff --stat -- ContainerApp/Resources/ThirdPartyNotices.txt
            MESSAGE="ThirdPartyNotices.txt is out of date with the resolved packages. Run scripts/generate-third-party-notices.py and commit the result."
            if [[ -n "${VERSION}" ]]; then
              echo "::error::${MESSAGE}"
              exit 1
            fi
            echo "::warning::${MESSAGE}"
          fi

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme ContainerApp \
            -configuration Release \
            -archivePath build/ContainerApp.xcarchive \
            -destination 'generic/platform=macOS' \
            archive

      - name: Package .app into zip
        id: package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          APP_PATH="build/ContainerApp.xcarchive/Products/Applications/ContainerApp.app"
          if [ ! -d "${APP_PATH}" ]; then
            echo "::error::Archived app not found at ${APP_PATH}"
            ls -la build/ContainerApp.xcarchive/Products/Applications/ || true
            exit 1
          fi
          ZIP_NAME="ContainerApp${VERSION:+-${VERSION}}.zip"
          ditto -c -k --keepParent "${APP_PATH}" "${ZIP_NAME}"
          ARTIFACT_NAME="ContainerApp-app${VERSION:+-${VERSION}}"
          echo "zip-name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact-name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: ${{ steps.package.outputs.zip-name }}
          if-no-files-found: error
